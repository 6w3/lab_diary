[project]
name = "lab-diary"
version = "0.1.0"
description = "Personal laboratory diary for lab.behejsrdcem.cz"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "pydantic-settings>=2.6.0",
    "passlib[argon2]>=1.7.4",
    "itsdangerous>=2.2.0",
    "httpx>=0.28.0",
    "authlib>=1.3.2",
    "pillow>=11.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "pillow-heif>=0.20.0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
